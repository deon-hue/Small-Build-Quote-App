[build]
  command = "npm run build"
  publish = ".next"

# Disable Netlify's asset post-processing entirely.
# Next.js already handles minification/bundling — Netlify's pass just times out
# on large App Router builds with many chunks.
[build.processing]
  skip_processing = true

[build.processing.html]
  pretty_urls = false

[build.processing.css]
  bundle = false
  minify = false

[build.processing.js]
  bundle = false
  minify = false

[build.processing.images]
  compress = false

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"
